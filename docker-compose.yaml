services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: signoz-clickhouse
    volumes:
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/memory.xml
      - ./data/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1000M
    restart: on-failure

  signoz:
    image: signoz/signoz:0.41.0
    container_name: signoz-unified
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
    volumes:
      - ./data/signoz:/var/lib/signoz
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600M
    restart: on-failure

  otel-collector:
    image: signoz/signoz-otel-collector:0.88.10
    container_name: signoz-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200M
    restart: on-failure

  caddy:
    image: caddy:2-alpine
    container_name: signoz-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SIGNOZ_DOMAIN=${SIGNOZ_DOMAIN}
      - SIGNOZ_ADMIN_PASSWORD_HASH=${SIGNOZ_ADMIN_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - signoz
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped

networks:
  default:
    name: signoz-network
